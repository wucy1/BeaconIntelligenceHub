# Render Blueprint — deploy from repo root or point Render at backend/ + this file.
# Dashboard: New → Blueprint, or Web Service → Docker, root directory: backend

services:
  - type: web
    name: bih-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://beacon.cila.workers.dev
      - key: REPORTER_SALT
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PORT
        value: "8080"
